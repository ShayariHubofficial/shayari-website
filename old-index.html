<title>माझी शायरी | Sairaj Santosh Hankare</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top left,#5b21b6 0%,transparent 35%),
        radial-gradient(circle at bottom right,#be185d 0%,transparent 35%),
        linear-gradient(135deg,#09001a,#17052e,#09001a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    top:5%;
    right:5%;
    filter:blur(5px);
    animation:float 6s ease-in-out infinite;
}

body::after{
    content:"";
    position:fixed;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(236,72,153,.08);
    bottom:5%;
    left:5%;
    animation:float 7s ease-in-out infinite reverse;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-25px);}
}

.container{
    width:100%;
    max-width:900px;
    position:relative;
    z-index:2;
}

.card{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-radius:32px;
    padding:45px 35px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.15);
}

.logo{
    text-align:center;
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:.7;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:clamp(36px,7vw,68px);
    margin-bottom:10px;
    background:linear-gradient(90deg,#fff,#f9a8d4,#fff);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    opacity:.7;
    margin-bottom:35px;
    font-size:16px;
}

.categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
}

.category{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:13px 22px;
    border-radius:50px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.category:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.15);
}

.category.active{
    background:linear-gradient(135deg,#ec4899,#8b5cf6);
    border-color:transparent;
    box-shadow:0 8px 25px rgba(236,72,153,.3);
}

.shayari-box{
    min-height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 25px;
    border-radius:25px;
    background:rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.1);
    margin-bottom:25px;
}

#shayari{
    font-size:clamp(21px,3vw,30px);
    line-height:1.9;
    font-weight:500;
    animation:fade .5s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
}

.btn{
    border:none;
    padding:14px 25px;
    border-radius:50px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px) scale(1.03);
}

.new-btn{
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    color:#fff;
    box-shadow:0 8px 25px rgba(139,92,246,.3);
}

.like-btn{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
}

.like-btn.liked{
    background:linear-gradient(135deg,#ef4444,#ec4899);
    border-color:transparent;
}

.like-count{
    text-align:center;
    margin-top:20px;
    font-size:16px;
    opacity:.75;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.1);
    opacity:.65;
    font-size:14px;

    color:#f9a8d4;

    .card{

    .categories{

    }

    .controls{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

</style>
</head>

/* =========================
   WEBSITE LOGIC
========================= */

const categories = {
    love: love,
    attitude: attitude,
    motivation: motivation
};

let currentCategory = "love";
let usedIndexes = {
    love: [],
    attitude: [],
    motivation: []
};

let likes = 0;

function getNewIndex(category){

    const list = categories[category];

    if(usedIndexes[category].length >= list.length){
        usedIndexes[category] = [];
    }

    let index;

    do{
        index = Math.floor(Math.random() * list.length);
    }
    while(usedIndexes[category].includes(index));

    usedIndexes[category].push(index);

    return index;
}

function showShayari(){

    const index = getNewIndex(currentCategory);

    document.getElementById("shayari").innerHTML =
        categories[currentCategory][index];

    document.getElementById("likeBtn").classList.remove("liked");
    document.getElementById("likeBtn").innerHTML = "❤️ Like";

    document.getElementById("likeCount").innerHTML =
        likes + " Likes";
}

function changeCategory(category, button){

    currentCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    showShayari();
}

function newShayari(){

    showShayari();
}

function likeShayari(){

    likes++;

    document.getElementById("likeCount").innerHTML =
        likes + " Likes ❤️";

    document.getElementById("likeBtn").classList.add("liked");

    document.getElementById("likeBtn").innerHTML =
        "❤️ Liked!";
}

showShayari();

</script>
